name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
          - macos-15-intel
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: >-
          python tools/install/dependency_manager.py install
          --contract tools/install/dependencies.toml
          --receipt "${RUNNER_TEMP}/x5crop-dependencies.json"
      - name: Run repository verifier
        run: tools/verify full
