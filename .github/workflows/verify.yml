name: Verify

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: >-
          python tools/install/dependency_manager.py install
          --contract tools/install/dependencies.toml
          --receipt "${RUNNER_TEMP}/x5crop-dependencies.json"
      - name: Run repository verifier
        run: tools/verify full
